name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test --silent

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            npm publish --access public --ignore-scripts
          else
            echo "NPM_TOKEN not provided; skipping npm publish"
          fi

      - name: Package VSIX
        continue-on-error: true
        working-directory: vscode-extension
        run: |
          npm install
          npx vsce package --out ../deadcode-funeral.vsix

      - name: Publish VSIX to Marketplace
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.MARKETPLACE_TOKEN }}
        run: |
          if [ -n "${VSCE_PAT}" ]; then
            cd vscode-extension && npx vsce publish -p "$VSCE_PAT"
          else
            echo "MARKETPLACE_TOKEN not provided; skipping VSIX publish"
          fi
