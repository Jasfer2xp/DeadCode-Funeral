name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: Package VSIX
        run: npm run package:vsix
      - name: Publish VSIX to Marketplace
        env:
          VSCE_PAT: ${{ secrets.MARKETPLACE_TOKEN }}
        run: |
          if [ -n "${VSCE_PAT}" ]; then
            npx vsce publish -p "$VSCE_PAT" || true
          else
            echo "MARKETPLACE_TOKEN not provided; skipping VSIX publish"
          fi
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            npm publish --access public
          else
            echo "NPM_TOKEN not provided; skipping npm publish"
          fi
