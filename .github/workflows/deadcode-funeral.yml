name: DeadCode Funeral

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run DeadCode Funeral action
        uses: ./action
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          warn-days-before: '7'
          path: '.'
