name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test --silent
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public
      - name: Package VSIX
        run: |
          npm run package:vsix || true
      - name: Publish VSIX to Marketplace
        if: ${{ secrets.MARKETPLACE_TOKEN != '' }}
        env:
          MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
        run: |
          npx vsce publish --pat $MARKETPLACE_TOKEN || echo 'VSCE publish failed or not configured.'
