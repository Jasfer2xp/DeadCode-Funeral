name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test --silent

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public --provenance

      - name: Package VSIX
        run: |
          cd vscode-extension && npm install && cd ..
          npm run package:vsix || true

      - name: Publish VSIX to Marketplace
        env:
          MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
        run: |
          if [ -n "${MARKETPLACE_TOKEN}" ]; then
            npx vsce publish --pat "$MARKETPLACE_TOKEN" || echo 'VSCE publish failed or not configured.'
          else
            echo "MARKETPLACE_TOKEN not provided; skipping VSIX publish"
          fi
